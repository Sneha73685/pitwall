[project]
name = "pitwall-backend"
version = "0.1.0"
description = "PitWall backend API (FastAPI) -- serves processed telemetry over a typed REST contract."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "httpx>=0.27",
    "pandas-stubs>=2.3.3.260113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core, I: isort, UP: pyupgrade, B: bugbear, N: naming
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern requires Depends()/Query() as argument defaults --
# not the mutable-default footgun B008 otherwise guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
