[project]
name = "pitwall-pipeline"
version = "0.1.0"
description = "PitWall data ingestion pipeline -- fetches, normalizes, and caches F1 telemetry."
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pitwall_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# fastf1 ships without type stubs; relax only for that import.
[[tool.mypy.overrides]]
module = "fastf1.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
